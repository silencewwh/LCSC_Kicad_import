name: Build LCSC KiCad Bridge

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build installation ZIP
        run: python tools/build_lcsc_plugin.py

      - name: Upload installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LCSC-KiCad-Bridge
          path: dist/LCSC-KiCad-Bridge.zip
          if-no-files-found: error
