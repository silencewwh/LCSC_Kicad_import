name: 问题反馈
description: 报告立创元件桥的页面按钮、原理图入口或导入问题
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: 运行环境
      description: KiCad 版本、插件版本、操作系统
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: 商品页或立创编号
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 错误信息
      description: 可附窗口下方的日志、截图或入口自检输出；请移除私人路径等不相关信息。
